# Runs the offline scorecard and writes out/scorecard.html on the host.
# The image is stock Python. The tool uses the standard library only.
services:
  scorecard:
    image: python:3.12-alpine
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
      SCORECARD_MODE: ${SCORECARD_MODE:-local}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_DATASET_ID: ${RAGFLOW_DATASET_ID:-}
      RAGFLOW_RERANK_ID: ${RAGFLOW_RERANK_ID:-}
    command: ["python", "scorecard.py", "--out", "out/scorecard.html"]
